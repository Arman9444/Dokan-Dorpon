<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokan Dorpon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="wrap header-row">
      <div class="menu">
        <button id="menu-button" class="menu-button" aria-label="Menu" aria-expanded="false"
                aria-controls="menu" onclick="toggleMenu()">
          <span></span><span></span><span></span>
        </button>
        <nav id="menu">
          <button data-tab="dashboard" class="active" onclick="showTab('dashboard')">Dashboard</button>
          <button data-tab="products" onclick="showTab('products')">Products</button>
          <button data-tab="sell" onclick="showTab('sell')">Sell</button>
          <button data-tab="stock-in" onclick="showTab('stock-in')">Stock in</button>
          <button data-tab="reports" onclick="showTab('reports')">Reports</button>
          <button data-tab="suggestions" onclick="showTab('suggestions')">Suggestions</button>
          <button data-tab="festivals" onclick="showTab('festivals')">Festivals</button>
        </nav>
      </div>
      <div>
        <h1>Dokan Dorpon <span class="bangla" lang="bn">দোকান দর্পণ</span></h1>
        <p>
          Today: <b id="today">-</b>
          <span class="divider">|</span> Festival / season now: <b id="occasions">-</b>
          <span class="divider">|</span> Coming in 60 days: <b id="upcoming">-</b>
        </p>
      </div>
    </div>
  </header>

  <main>
    <div id="message" class="message hidden"></div>

    <section id="dashboard">
      <h2>Dashboard</h2>
    </section>

    <section id="products" class="hidden">
      <h2>Products</h2>
    </section>

    <section id="sell" class="hidden">
      <h2>Sell</h2>
    </section>

    <section id="stock-in" class="hidden">
      <h2>Stock in</h2>
    </section>

    <section id="reports" class="hidden">
      <h2>Reports</h2>
    </section>

    <section id="suggestions" class="hidden">
      <h2>Suggestions</h2>
    </section>

    <section id="festivals" class="hidden">
      <h2>Festivals</h2>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
